# Elevator Control System configuration

# Modbus/TCP slave (the PLC running the elevator simulation)
modbus.host=localhost
modbus.port=506

# Control loop cycle time in milliseconds (assignment suggests ~100 ms).
control.cycleMillis=100

# Group letter (drives the simulation URLs aufzug{group}simu.htm / ctrl.htm).
elevator.group=e

# HMI transport (MQTT). Activated with the --mqtt flag.
# For local development run a broker such as Mosquitto on this machine.
mqtt.host=localhost
mqtt.port=1883
# Base topic; status/event/cmd are appended.
mqtt.baseTopic=/SysArch/E
# Broker credentials. Leave EMPTY here (keep secrets out of git) and pass them at runtime:
#   -Dmqtt.username=... -Dmqtt.password=...   or   MQTT_USERNAME / MQTT_PASSWORD env vars.
# Precedence: -D system property > env var > this file.
mqtt.username=
mqtt.password=
